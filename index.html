<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pyébwa a Konesans — contes créoles de Guadeloupe en 3D, en kréyòl et en français."
    />
    <title lang="gcf">Pyébwa a Konesans — Kont Gwadloup</title>
    <style>
      /* Runs before src/shared/theme/tokens.css: colours and families are literal mirrors of its tokens. */
      .loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 46%, oklch(0.94 0.08 80 / 0.9) 0, transparent 230px),
          linear-gradient(
            180deg,
            oklch(0.82 0.05 300) 0%,
            oklch(0.86 0.07 30) 46%,
            oklch(0.88 0.08 65) 64%,
            oklch(0.92 0.07 80) 74%
          );
        color: oklch(0.27 0.045 280);
        text-align: center;
        transition: opacity 0.7s ease;
      }
      .loader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .loader-logo {
        width: min(180px, 42vw);
        height: auto;
        filter: drop-shadow(0 6px 18px oklch(0.78 0.14 70 / 0.35));
        animation: loader-breathe 2.4s ease-in-out infinite;
      }
      .loader-brand {
        margin: 0;
        font:
          700 13px/1 "Andika",
          sans-serif;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }
      .loader-line {
        margin: 10px 0 0;
        font:
          italic 500 clamp(24px, 5vw, 32px)/1.2 "Newsreader",
          serif;
      }
      @keyframes loader-breathe {
        50% {
          transform: scale(1.04);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader" role="status" aria-live="polite">
      <img
        class="loader-logo"
        src="/src/app/assets/tipunchlabs-logo.webp"
        alt=""
        width="360"
        height="285"
      />
      <div>
        <p class="loader-brand">tipunchlabs</p>
        <p class="loader-line" lang="gcf">ka prézanté kont gwadloup</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
